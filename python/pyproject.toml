[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vinworld-vinmail"
version = "0.1.0"
description = "Official zero-dependency Python SDK for the VinMail transactional email API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Vinworld", email = "dev@vinworlddev.com" }]
keywords = ["vinmail", "vinworld", "email", "transactional-email", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://vinmail.vinworlddev.com"
Documentation = "https://vinmail.vinworlddev.com/docs"
Repository = "https://github.com/vinworld/vinmail-sdks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vinmail = ["py.typed"]
